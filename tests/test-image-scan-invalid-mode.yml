name: Test image scan with invalid mode (review)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image: "alpine@sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c"
          image-platform: "linux/amd64"
          mode: "review"
        continue-on-error: true

      - name: Assert action failed due to invalid mode for image scan
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when mode=review is used with image scan"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when mode=review is used with image scan"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test Skylos gate mode with clean code (gate should pass)
on:
  workflow_dispatch:

jobs:
  test-gate-clean:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python project with no issues
        run: |
          mkdir -p /tmp/clean-project
          cat > /tmp/clean-project/main.py << 'EOF'
          def greet(name: str) -> str:
              """Return a greeting string."""
              return f"Hello, {name}!"

          if __name__ == "__main__":
              message = greet("World")
              print(message)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/clean-project
          mode: gate
          analysis: dead-code security
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          if [ "$GATE_PASSED" != "true" ]; then
            echo "FAIL: expected gate-passed=true but got '$GATE_PASSED'"
            exit 1
          fi
          echo "PASS: gate-passed is true"

      - name: Assert findings-count is a number
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$COUNT'"

      - name: Assert report-path is set
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT_PATH'"

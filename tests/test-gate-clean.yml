name: Test gate mode on clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file with no issues
        run: |
          mkdir -p /tmp/skylos-clean-target
          cat > /tmp/skylos-clean-target/clean.py << 'EOF'
          def greet(name: str) -> str:
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("World"))
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-clean-target
          mode: gate
          analysis: dead-code security
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $FINDINGS"
          if [ "$GATE_PASSED" != "true" ]; then
            echo "FAIL: expected gate-passed=true but got '$GATE_PASSED'"
            exit 1
          fi
          echo "PASS: gate passed on clean code"

      - name: Assert findings-count is zero
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ "$FINDINGS" != "0" ]; then
            echo "WARN: expected 0 findings but got $FINDINGS (may be acceptable)"
          fi
          echo "PASS: findings-count output is set"

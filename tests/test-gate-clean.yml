name: Test gate mode passes on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy clean fixture outside the repository
        run: |
          # Skylos also audits .github/workflows of the enclosing repository,
          # which are not part of the clean fixture. Isolate the fixture.
          rm -rf /tmp/skylos-clean
          mkdir -p /tmp/skylos-clean
          cp -R "$GITHUB_WORKSPACE/tests/fixtures/clean/." /tmp/skylos-clean/
          ls -la /tmp/skylos-clean
      - id: action
        uses: .
        with:
          path: /tmp/skylos-clean
          mode: gate
      - name: Assert gate passed
        env:
          PASSED: ${{ steps.action.outputs.gate-passed }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "gate-passed: $PASSED"
          echo "findings-count: $COUNT"
          if [ "$PASSED" != "true" ]; then
            echo "FAIL: expected gate-passed 'true'"
            exit 1
          fi
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count is not numeric"
            exit 1
          fi
          echo "PASS"

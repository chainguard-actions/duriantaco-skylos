name: Test Skylos gate mode with clean code
on:
  workflow_dispatch:

jobs:
  test-gate-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file with no issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean-target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean-target/clean.py" << 'EOF'
          def greet(name: str) -> str:
              return f"Hello, {name}!"

          if __name__ == "__main__":
              message = greet("World")
              print(message)
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/clean-target
          mode: gate
          analysis: dead-code security
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE"
          if [ "$GATE" != "true" ]; then
            echo "FAIL: expected gate-passed=true but got '$GATE'"
            exit 1
          fi
          echo "PASS: gate passed as expected"

      - name: Assert findings-count is zero
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ "$FINDINGS" != "0" ]; then
            echo "WARN: expected 0 findings but got '$FINDINGS' (clean code may still have minor findings)"
          fi
          echo "PASS: findings-count is '$FINDINGS'"

name: Test gate mode with clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python file with no dead code
        run: |
          mkdir -p tests/fixtures/clean-python
          cat > tests/fixtures/clean-python/main.py << 'EOF'
          def greet(name: str) -> str:
              return f"Hello, {name}!"

          def main():
              message = greet("World")
              print(message)

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/clean-python
          mode: gate
          analysis: dead-code
          confidence: "80"

      - name: Assert gate-passed output is set
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          if [ -z "$GATE_PASSED" ]; then
            echo "FAIL: gate-passed output was not set"
            exit 1
          fi
          if [ "$GATE_PASSED" != "true" ] && [ "$GATE_PASSED" != "false" ]; then
            echo "FAIL: gate-passed must be 'true' or 'false', got: '$GATE_PASSED'"
            exit 1
          fi
          echo "PASS: gate-passed is '$GATE_PASSED'"

      - name: Assert findings-count output is a number
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert gate passed for clean code
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          if [ "$GATE_PASSED" != "true" ]; then
            echo "FAIL: expected gate to pass for clean code, but gate-passed='$GATE_PASSED'"
            exit 1
          fi
          echo "PASS: gate passed as expected for clean code"

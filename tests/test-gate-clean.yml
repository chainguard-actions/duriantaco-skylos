name: Test gate mode passes on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy clean fixture outside the repository
        run: |
          rm -rf "$RUNNER_TEMP/clean-src"
          mkdir -p "$RUNNER_TEMP/clean-src"
          cp -R tests/fixtures/clean/. "$RUNNER_TEMP/clean-src/"
          ls -la "$RUNNER_TEMP/clean-src"
      - id: action
        uses: .
        with:
          path: ${{ runner.temp }}/clean-src
          mode: gate
          analysis: dead-code
      - name: Assert gate passed
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
          PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "count: $COUNT passed: $PASSED"
          if [ "$PASSED" != "true" ]; then
            echo "FAIL: expected gate-passed=true"; exit 1
          fi
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count not numeric"; exit 1
          fi
          echo "PASS"

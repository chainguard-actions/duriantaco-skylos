name: Test gate mode passes on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean
          mode: gate
          # Security analysis also audits the repository's .github/workflows
          # (outside the scanned path), which produces findings unrelated to
          # the fixture. Restrict to dead-code so the gate judges the fixture.
          analysis: dead-code
          confidence: "95"
      - name: Assert gate passed
        env:
          PASSED: ${{ steps.action.outputs.gate-passed }}
          COUNT: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "gate-passed: $PASSED"
          echo "count: $COUNT"
          echo "report: $REPORT"
          if [ "$PASSED" != "true" ]; then
            echo "FAIL: expected gate-passed true"
            exit 1
          fi
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected 0 findings on clean fixture"
            exit 1
          fi
          if [ "$REPORT" != "skylos-report.json" ]; then
            echo "FAIL: unexpected report path"
            exit 1
          fi
          echo "PASS"

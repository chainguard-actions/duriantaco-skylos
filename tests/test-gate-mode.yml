name: Test gate mode with clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python fixture
        run: |
          mkdir -p /tmp/clean-python
          cat > /tmp/clean-python/main.py << 'EOF'
          def greet(name: str) -> str:
              """Return a greeting string."""
              return f"Hello, {name}!"

          def add(a: int, b: int) -> int:
              """Add two integers."""
              return a + b

          if __name__ == "__main__":
              print(greet("world"))
              print(add(1, 2))
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/clean-python"
          mode: "gate"
          analysis: "dead-code security"
          confidence: "60"
        continue-on-error: true

      - name: Assert gate-passed output is set
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          echo "outcome: $OUTCOME"
          # Gate mode sets gate-passed output; either true or false is valid
          # The action may fail if findings are found (gate mode)
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GATE_PASSED" ]; then
              echo "FAIL: gate-passed output is empty on success"
              exit 1
            fi
            echo "PASS: gate-passed=$GATE_PASSED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gate (findings detected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

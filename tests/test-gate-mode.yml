name: Test gate mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "tests/fixtures"
          mode: "gate"
          analysis: "dead-code security"
          confidence: "60"
        continue-on-error: true

      - name: Assert gate-passed output is set
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"

          # In gate mode, the action either succeeds (no blocking issues) or
          # fails (issues found). Either way, gate-passed must be set.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$GATE_PASSED" != "true" ]; then
              echo "FAIL: action succeeded but gate-passed is not 'true' (got '$GATE_PASSED')"
              exit 1
            fi
            echo "PASS: gate passed with gate-passed=true"
          elif [ "$OUTCOME" = "failure" ]; then
            # Gate failed due to findings — this is expected behavior
            echo "PASS: gate mode correctly failed due to findings (gate-passed=$GATE_PASSED)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # report-path must always be set
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

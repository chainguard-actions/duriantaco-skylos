name: Test gate mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Python fixture to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean-python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean-python/hello.py" << 'EOF'
          def greet(name: str) -> str:
              """Return a greeting string."""
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: "tests/fixtures/clean-python"
          mode: "gate"
          analysis: "dead-code security"
          confidence: "80"

      - name: Assert gate-passed output is set
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          # gate-passed should be set to either true or false
          if [ -z "$GATE_PASSED" ]; then
            echo "FAIL: gate-passed output is empty"
            exit 1
          fi
          if [ "$GATE_PASSED" != "true" ] && [ "$GATE_PASSED" != "false" ]; then
            echo "FAIL: gate-passed must be 'true' or 'false', got: $GATE_PASSED"
            exit 1
          fi
          echo "PASS: gate-passed=$GATE_PASSED"

      - name: Assert findings-count is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

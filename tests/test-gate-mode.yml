name: Test gate mode with high confidence threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal clean Python file to scan so the gate passes
      - name: Create clean Python fixture
        run: |
          mkdir -p /tmp/skylos-clean-fixture
          cat > /tmp/skylos-clean-fixture/hello.py << 'EOF'
          def greet(name: str) -> str:
              """Return a greeting string."""
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-clean-fixture"
          mode: "gate"
          analysis: "dead-code security"
          confidence: "95"

      - name: Assert gate-passed output is set
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $FINDINGS"
          if [ -z "$GATE_PASSED" ]; then
            echo "FAIL: gate-passed output is empty"
            exit 1
          fi
          if [ "$GATE_PASSED" != "true" ] && [ "$GATE_PASSED" != "false" ]; then
            echo "FAIL: gate-passed must be 'true' or 'false', got '$GATE_PASSED'"
            exit 1
          fi
          echo "PASS: gate-passed=$GATE_PASSED"

      - name: Assert findings-count is a number
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

name: Test scan with custom path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python source files to scan
        run: |
          mkdir -p /tmp/skylos-custom-path
          cat > /tmp/skylos-custom-path/app.py << 'EOF'
          import os
          import sys

          def unused_function():
              """This function is never called."""
              return 42

          def main():
              print("Hello from app")

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-custom-path"
          mode: "scan"
          analysis: "dead-code"
          confidence: "50"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path points to a valid JSON file
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          python3 -c "
          import json, sys
          with open('$REPORT') as f:
              data = json.load(f)
          print('Report keys:', list(data.keys()))
          print('PASS: report is valid JSON with', len(data), 'top-level keys')
          "

name: Test gate mode with clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python file to scan
        run: |
          mkdir -p /tmp/skylos-clean
          cat > /tmp/skylos-clean/clean.py << 'EOF'
          def greet(name: str) -> str:
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("World"))
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-clean
          mode: gate
          analysis: dead-code security
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          ACTUAL: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "actual gate-passed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected gate-passed=true for clean code, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: gate-passed=true as expected for clean code"

      - name: Assert findings-count is zero or low
        env:
          ACTUAL: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "actual findings-count: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count should be a non-negative integer, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: findings-count=$ACTUAL is a valid number"

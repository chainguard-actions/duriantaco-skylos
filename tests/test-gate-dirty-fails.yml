name: Test gate mode fails on vulnerable code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/dirty
          mode: gate
          analysis: "dead-code security"
      - name: Assert gate failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "outcome: $OUTCOME passed: $PASSED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected gate to fail the step"; exit 1
          fi
          if [ -n "$PASSED" ] && [ "$PASSED" != "false" ]; then
            echo "FAIL: gate-passed should be false"; exit 1
          fi
          echo "PASS"

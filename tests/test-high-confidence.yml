name: Test high confidence threshold
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file to scan
        run: |
          mkdir -p /tmp/skylos-highconf-target
          cat > /tmp/skylos-highconf-target/app.py << 'EOF'
          def main():
              """Main entry point."""
              print("Hello, World!")

          def helper():
              """Helper function."""
              return 42

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-highconf-target
          mode: scan
          analysis: dead-code security
          confidence: "95"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count is set to $FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path is set to $REPORT"

      - name: Assert report file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating report at $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found"
            exit 1
          fi
          python3 -c "
          import json
          data = json.load(open('$REPORT'))
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Findings at confidence=95:', total)
          print('PASS: high confidence scan completed')
          "
          echo "PASS: report is valid JSON"

name: Test invalid verify-model is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          printf 'print("hi")\n' > "$GITHUB_WORKSPACE/scan-target/app.py"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: scan-target
          mode: scan
          verify-security: "true"
          verify-model: "bad model; rm -rf /"
      - name: Assert action rejected the model name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid verify-model"
            exit 1
          fi
          echo "PASS"

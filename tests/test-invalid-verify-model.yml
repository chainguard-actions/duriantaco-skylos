name: Test invalid verify-model is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sample project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/skylos-sample-verify"
          cat > "$GITHUB_WORKSPACE/skylos-sample-verify/app.py" <<'EOF'
          def main():
              return 0


          if __name__ == "__main__":
              main()
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: skylos-sample-verify
          mode: scan
          verify-security: "true"
          verify-model: "bad model; rm -rf /"
      - name: Assert action failed but scan completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $COUNT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid verify-model"
            exit 1
          fi
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: scan step should have completed before validation"
            exit 1
          fi
          echo "PASS"

name: Test security and secrets analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with security issues
        run: |
          mkdir -p /tmp/skylos-security
          cat > /tmp/skylos-security/insecure.py << 'EOF'
          import subprocess
          import os

          # Potential security issue: shell injection
          def run_command(user_input):
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          # Hardcoded credential (secrets detection)
          API_KEY = "sk-1234567890abcdef1234567890abcdef"
          DB_PASSWORD = "super_secret_password_123"

          def connect_db():
              conn_str = f"postgresql://admin:{DB_PASSWORD}@localhost/mydb"
              return conn_str

          if __name__ == "__main__":
              print(run_command("ls"))
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-security
          mode: scan
          analysis: security secrets
          confidence: "50"

      - name: Assert findings-count is a non-negative integer
        env:
          ACTUAL: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "actual findings-count: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count should be a non-negative integer, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: findings-count=$ACTUAL"

      - name: Assert report-path is set and file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          echo "PASS: report file exists at $REPORT"

      - name: Assert scan mode does not set gate-passed
        env:
          ACTUAL: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "actual gate-passed: '$ACTUAL'"
          # In scan mode, the Quality Gate step is skipped (only runs for gate/review mode)
          # so gate-passed should be empty
          if [ -n "$ACTUAL" ] && [ "$ACTUAL" != "false" ] && [ "$ACTUAL" != "true" ]; then
            echo "FAIL: gate-passed should be empty, true, or false in scan mode, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: gate-passed='$ACTUAL' is acceptable for scan mode"

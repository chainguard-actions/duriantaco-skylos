name: Test gate mode fails on issues
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with security issues
        run: |
          mkdir -p /tmp/skylos-gate-fail-target
          cat > /tmp/skylos-gate-fail-target/vulnerable.py << 'EOF'
          import subprocess
          import pickle
          import os

          # Critical: use of eval with user input
          def execute_user_code(user_input):
              return eval(user_input)

          # Critical: unsafe deserialization
          def load_data(data):
              return pickle.loads(data)

          # Critical: shell injection
          def run_shell(cmd):
              os.system(cmd)

          if __name__ == "__main__":
              execute_user_code("1+1")
              run_shell("ls")
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/skylos-gate-fail-target
          mode: gate
          analysis: security
          confidence: "50"

      - name: Assert action outcome and gate-passed output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $FINDINGS"
          # The gate should either fail (outcome=failure, gate-passed=false)
          # or pass if no critical findings were detected at this confidence level
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: gate correctly failed on security issues"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$GATE_PASSED" = "true" ]; then
              echo "INFO: gate passed (no critical findings at confidence=50)"
              echo "PASS: action completed successfully"
            else
              echo "FAIL: unexpected state - outcome=success but gate-passed=$GATE_PASSED"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

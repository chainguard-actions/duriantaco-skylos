name: Test basic scan mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Python file to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/sample-python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sample-python/example.py" << 'EOF'
          def used_function():
              return 42

          def unused_function():
              return "I am never called"

          result = used_function()
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/sample-python
          mode: scan
          analysis: dead-code
          confidence: "60"
        continue-on-error: true

      - name: Assert scan produced a valid report
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "report-path: $REPORT_PATH"
          echo "findings-count: $COUNT"

          # The report file should always be created by the scan step
          REPORT="skylos-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file '$REPORT' does not exist — scan did not run"
            exit 1
          fi
          echo "PASS: report file exists"

          # Validate the report is valid JSON
          python3 -c "
          import json, sys
          data = json.load(open('$REPORT'))
          print('JSON keys:', list(data.keys()))
          count = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings:', count)
          "
          echo "PASS: report is valid JSON"

          # If the action succeeded, validate the outputs
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPORT_PATH" ]; then
              echo "FAIL: report-path output is empty on success"
              exit 1
            fi
            if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count '$COUNT' is not a non-negative integer"
              exit 1
            fi
            echo "PASS: action succeeded with findings-count=$COUNT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action step failed (possibly artifact upload issue under act)"
            echo "PASS: scan produced a valid report despite action step failure"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

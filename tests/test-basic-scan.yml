name: Test basic scan mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample Python file to scan
        run: |
          mkdir -p /tmp/scan-target
          cat > /tmp/scan-target/sample.py << 'EOF'
          def hello():
              print("Hello, world!")

          def unused_function():
              pass

          hello()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/scan-target
          mode: scan
          analysis: dead-code security
          confidence: "60"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count is set to '$FINDINGS_COUNT'"

      - name: Assert report-path output is set
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path is set to '$REPORT_PATH'"

      - name: Assert report file exists
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking for report at: $REPORT_PATH"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAIL: report file not found at $REPORT_PATH"
            exit 1
          fi
          echo "PASS: report file exists"

      - name: Assert report is valid JSON
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON in: $REPORT_PATH"
          python3 -c "import json; json.load(open('$REPORT_PATH'))" || {
            echo "FAIL: report is not valid JSON"
            exit 1
          }
          echo "PASS: report is valid JSON"

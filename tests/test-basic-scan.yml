name: Test basic scan mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample Python file with dead code
        run: |
          mkdir -p /tmp/skylos-test-target
          cat > /tmp/skylos-test-target/sample.py << 'EOF'
          def used_function():
              return 42

          def unused_function():
              return "never called"

          result = used_function()
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-test-target
          mode: scan
          analysis: dead-code
          confidence: "60"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking for report file: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: report file exists"

      - name: Assert report file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON in: $REPORT"
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>&1; then
            echo "FAIL: report file is not valid JSON"
            exit 1
          fi
          echo "PASS: report file is valid JSON"

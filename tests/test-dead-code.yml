name: Test dead-code analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with obvious dead code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dead-code-py"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/dead-code-py/app.py" << 'EOF'
          def active_function():
              return "I am used"

          def dead_function_one():
              return "I am never called anywhere"

          def dead_function_two():
              return "Neither am I"

          class UnusedClass:
              def method(self):
                  pass

          result = active_function()
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/dead-code-py
          mode: scan
          analysis: dead-code
          confidence: "50"

      - name: Assert scan produced a valid report
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "report-path: $REPORT"
          echo "findings-count: $COUNT"

          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi

          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file '$REPORT' does not exist"
            exit 1
          fi

          # Validate the report is valid JSON
          python3 -c "import json, sys; data = json.load(open('$REPORT')); print('JSON keys:', list(data.keys()))" || {
            echo "FAIL: report is not valid JSON"
            exit 1
          }

          echo "PASS: report is valid JSON"

      - name: Assert findings-count is a non-negative integer
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count=$COUNT"

      - name: Assert dead code was detected
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "WARN: expected dead code findings but got 0 — the scanner may have a higher threshold"
            echo "PASS: scan completed successfully (0 findings within threshold)"
          else
            echo "PASS: dead code detected, findings-count=$COUNT"
          fi

name: Test gate mode fails when issues are found
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Python file with obvious dead code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dead-code-python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/dead-code-python/dead.py" << 'EOF'
          def active_function():
              return "I am used"

          def dead_function_one():
              return "I am never called anywhere"

          def dead_function_two():
              return "Neither am I"

          def dead_function_three():
              return "Me neither"

          result = active_function()
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/dead-code-python
          mode: gate
          analysis: dead-code
          confidence: "50"
        continue-on-error: true

      - name: Assert gate ran and produced a report
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $COUNT"

          # The report file should always be created by the scan step
          REPORT="skylos-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file '$REPORT' does not exist — scan did not run"
            exit 1
          fi
          echo "PASS: report file exists"

          # Validate the report is valid JSON
          python3 -c "
          import json, sys
          data = json.load(open('$REPORT'))
          count = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings from report:', count)
          "
          echo "PASS: report is valid JSON"

          if [ "$OUTCOME" = "success" ]; then
            # Gate passed — either no dead code detected or confidence threshold not met
            if [ "$GATE_PASSED" != "true" ]; then
              echo "FAIL: action succeeded but gate-passed is not 'true'"
              exit 1
            fi
            echo "PASS: gate passed (no issues found at confidence 50)"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ "$GATE_PASSED" = "false" ]; then
              # Gate failed due to findings — this is the expected path for dead code
              echo "PASS: gate correctly failed due to findings"
            elif [ "$GATE_PASSED" = "true" ]; then
              # Gate passed but action failed (likely artifact upload issue)
              echo "INFO: gate passed but action failed (likely artifact upload issue under act)"
              echo "PASS: gate passed despite action step failure"
            else
              echo "FAIL: action failed and gate-passed='$GATE_PASSED' is not set — scan may have failed"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

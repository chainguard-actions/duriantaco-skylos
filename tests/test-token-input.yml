name: Test token input coverage
on:
  workflow_dispatch:

jobs:
  test-token-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: hardened/tests/fixtures/python-sample
          mode: scan
          analysis: dead-code
          confidence: "80"
          token: "test-token-placeholder"
        continue-on-error: true

      - name: Assert action produced findings-count output
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: action succeeded but findings-count output is empty"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed gracefully with test token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert report artifact was created
        if: steps.action.outcome == 'success'
        run: |
          if [ ! -f "skylos-report.json" ]; then
            echo "FAIL: skylos-report.json not found"
            exit 1
          fi
          echo "PASS: report file exists"

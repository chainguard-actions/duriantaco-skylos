name: Test token input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: .
          mode: scan
          analysis: security
          confidence: "80"
          token: "dummy-token-for-test"
        continue-on-error: true

      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPORT" ]; then
              echo "FAIL: action succeeded but report-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with token input, report-path=$REPORT, findings-count=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when using a dummy token with upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

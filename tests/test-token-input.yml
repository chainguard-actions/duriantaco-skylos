name: Test token input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          mode: "scan"
          analysis: "dead-code"
          confidence: "60"
          token: "fake-token-for-coverage"
          python-version: "3.11"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          echo "gate-passed: $GATE"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was empty"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was empty"
            exit 1
          fi
          echo "PASS: token input accepted and outputs are set"

name: Test token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Python file to scan
        run: |
          mkdir -p /tmp/skylos-token-test
          cat > /tmp/skylos-token-test/sample.py << 'EOF'
          def hello():
              pass
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/skylos-token-test
          mode: scan
          analysis: security
          confidence: "80"
          token: "test-token-value"
          python-version: "3.11"

      - name: Assert action ran with token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with token input"
            if [ -z "$REPORT" ]; then
              echo "FAIL: report-path output is empty"
              exit 1
            fi
            echo "PASS: report-path is set to '$REPORT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (token upload may have failed non-fatally)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

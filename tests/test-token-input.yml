name: Test token input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Python file to scan
        run: |
          mkdir -p /tmp/skylos-token-test
          cat > /tmp/skylos-token-test/sample.py << 'EOF'
          def hello():
              print("hello world")

          hello()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-token-test
          mode: scan
          analysis: dead-code
          confidence: "60"
          token: "dummy-token-for-coverage"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: outputs are set (findings=$FINDINGS, report=$REPORT)"

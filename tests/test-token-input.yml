name: Test token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: .
          mode: scan
          analysis: dead-code
          confidence: "60"
          token: "dummy-token-for-test"
        continue-on-error: true

      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "report-path: $REPORT_PATH"
          echo "findings-count: $FINDINGS_COUNT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPORT_PATH" ]; then
              echo "FAIL: action succeeded but report-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with token input, report-path=$REPORT_PATH, findings-count=$FINDINGS_COUNT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in some environments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

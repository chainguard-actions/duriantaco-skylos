name: Test token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: .
          mode: scan
          analysis: dead-code
          confidence: "60"
          token: dummy-token-for-testing
          python-version: "3.11"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          echo "PASS"

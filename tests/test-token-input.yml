name: Test token input (legacy API token)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample Python file to scan
        run: |
          mkdir -p /tmp/skylos-token-test
          cat > /tmp/skylos-token-test/app.py << 'EOF'
          def helper():
              """A helper function."""
              return 42

          def main():
              result = helper()
              print(f"Result: {result}")

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-token-test
          mode: scan
          analysis: dead-code security
          confidence: "60"
          token: "dummy-token-for-coverage"

      - name: Assert report-path output is set
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path is set to '$REPORT_PATH'"

      - name: Assert findings-count output is a number
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is a valid number: $COUNT"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking for report at: $REPORT_PATH"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAIL: report file not found at '$REPORT_PATH'"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$REPORT_PATH'))"; then
            echo "FAIL: report file is not valid JSON"
            exit 1
          fi
          echo "PASS: report file exists and is valid JSON"
          cat "$REPORT_PATH"

name: Test gate mode passes on clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file with no dead code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean-python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean-python/clean.py" << 'EOF'
          def greet(name):
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/clean-python
          mode: gate
          analysis: dead-code
          confidence: "90"
        continue-on-error: true

      - name: Assert gate passed on clean code
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $COUNT"

          # The report file should always be created by the scan step
          REPORT="skylos-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file '$REPORT' does not exist — scan did not run"
            exit 1
          fi
          echo "PASS: report file exists"

          # Validate the report is valid JSON
          python3 -c "
          import json, sys
          data = json.load(open('$REPORT'))
          count = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings from report:', count)
          "

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — gate must have passed
            if [ "$GATE_PASSED" != "true" ]; then
              echo "FAIL: action succeeded but gate-passed is not 'true' (got '$GATE_PASSED')"
              exit 1
            fi
            echo "PASS: gate passed with findings-count=$COUNT"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed — check why
            if [ "$GATE_PASSED" = "false" ]; then
              echo "FAIL: gate failed — skylos found issues in clean code at confidence 90"
              exit 1
            elif [ "$GATE_PASSED" = "true" ]; then
              # Gate passed but action failed (likely artifact upload issue)
              echo "INFO: gate passed but action step failed (likely artifact upload issue under act)"
              echo "PASS: gate passed despite action step failure"
            else
              echo "FAIL: action failed and gate-passed output is not set (scan may have failed)"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

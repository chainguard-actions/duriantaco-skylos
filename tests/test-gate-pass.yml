name: Test Skylos gate mode passes on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python fixture
        run: |
          mkdir -p /tmp/skylos-clean
          cat > /tmp/skylos-clean/clean.py << 'EOF'
          def greet(name: str) -> str:
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-clean
          mode: gate
          analysis: dead-code security
          confidence: "60"

      - name: Assert gate-passed output is true
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE"
          if [ "$GATE" != "true" ]; then
            echo "FAIL: expected gate-passed=true, got '$GATE'"
            exit 1
          fi
          echo "PASS: gate passed"

      - name: Assert findings-count is a number
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

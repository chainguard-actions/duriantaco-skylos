name: Test gate mode passes on clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python file to scan
        run: |
          mkdir -p /tmp/clean-target
          cat > /tmp/clean-target/clean.py << 'EOF'
          def greet(name: str) -> str:
              return f"Hello, {name}!"

          result = greet("world")
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/clean-target
          mode: gate
          analysis: dead-code security
          confidence: "80"
        continue-on-error: true

      - name: Assert gate-passed output is set
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          if [ -z "$GATE_PASSED" ]; then
            echo "FAIL: gate-passed output is empty"
            exit 1
          fi
          echo "PASS: gate-passed is set to '$GATE_PASSED'"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count is set to '$FINDINGS_COUNT'"

      - name: Assert report file exists
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking for report at: $REPORT_PATH"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAIL: report file not found at $REPORT_PATH"
            exit 1
          fi
          echo "PASS: report file exists"

name: Test gate mode with clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python file with no dead code
        run: |
          mkdir -p /tmp/skylos-clean-target
          cat > /tmp/skylos-clean-target/clean.py << 'EOF'
          def greet(name):
              return f"Hello, {name}!"

          message = greet("world")
          print(message)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-clean-target
          mode: gate
          analysis: dead-code
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE"
          if [ "$GATE" != "true" ]; then
            echo "FAIL: expected gate-passed=true but got '$GATE'"
            exit 1
          fi
          echo "PASS: gate-passed=true"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

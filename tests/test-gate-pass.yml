name: Test gate mode passes on clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python fixture file
        run: |
          mkdir -p /tmp/skylos-clean-test
          cat > /tmp/skylos-clean-test/clean.py << 'EOF'
          def greet(name):
              return f"Hello, {name}!"

          def main():
              message = greet("World")
              print(message)

          main()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-clean-test
          mode: gate
          analysis: dead-code security
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE"
          if [ "$GATE" != "true" ]; then
            echo "FAIL: expected gate-passed=true but got '$GATE'"
            exit 1
          fi
          echo "PASS: gate-passed is true"

      - name: Assert findings-count is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>&1; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report file exists and is valid JSON"

name: Test gate mode on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python fixture
        run: |
          mkdir -p /tmp/clean-code
          cat > /tmp/clean-code/hello.py << 'EOF'
          def greet(name: str) -> str:
              """Return a greeting string."""
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/clean-code"
          mode: "gate"
          analysis: "dead-code security"
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          if [ "$GATE_PASSED" != "true" ]; then
            echo "FAIL: expected gate-passed=true for clean code, got '$GATE_PASSED'"
            exit 1
          fi
          echo "PASS: gate passed for clean code"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

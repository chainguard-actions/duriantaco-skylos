name: Test gate mode with clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "${{ github.workspace }}/tests/fixtures/python-clean"
          mode: "gate"
          analysis: "dead-code security"
          confidence: "80"
        continue-on-error: true

      - name: Assert gate mode ran and produced outputs or failed gracefully
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: action succeeded but findings-count is empty"
              exit 1
            fi
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
              exit 1
            fi
            if [ "$GATE_PASSED" != "true" ] && [ "$GATE_PASSED" != "false" ]; then
              echo "FAIL: gate-passed must be 'true' or 'false', got '$GATE_PASSED'"
              exit 1
            fi
            echo "PASS: gate mode completed, findings=$FINDINGS, gate-passed=$GATE_PASSED"
          elif [ "$OUTCOME" = "failure" ]; then
            # Gate mode can fail if findings exceed threshold or artifact upload fails under act
            echo "PASS: action ran and failed gracefully (gate enforced or artifact upload failed under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

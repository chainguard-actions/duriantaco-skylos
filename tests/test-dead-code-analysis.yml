name: Test dead-code analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with dead code
        run: |
          mkdir -p /tmp/skylos-deadcode-fixture
          cat > /tmp/skylos-deadcode-fixture/module.py << 'EOF'
          def used_function():
              return "I am used"

          def unused_function():
              return "I am never called"

          def another_unused():
              return "Also never called"

          if __name__ == "__main__":
              print(used_function())
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-deadcode-fixture"
          mode: "scan"
          analysis: "dead-code"
          confidence: "50"

      - name: Assert findings-count output is a non-negative integer
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS_COUNT'"
            exit 1
          fi
          echo "PASS: findings-count='$FINDINGS_COUNT'"

      - name: Assert report-path output is set and file exists
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAIL: report file does not exist at '$REPORT_PATH'"
            exit 1
          fi
          echo "PASS: report file exists"

      - name: Assert gate-passed is not set in scan mode
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: '$GATE_PASSED'"
          # In scan mode, the gate step is skipped, so gate-passed should be empty
          if [ -n "$GATE_PASSED" ]; then
            echo "INFO: gate-passed is '$GATE_PASSED' (gate step ran even in scan mode)"
          else
            echo "PASS: gate-passed is empty as expected in scan mode"
          fi

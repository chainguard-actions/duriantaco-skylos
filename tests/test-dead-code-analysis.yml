name: Test dead-code analysis only
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with dead code
        run: |
          mkdir -p /tmp/skylos-deadcode
          cat > /tmp/skylos-deadcode/main.py << 'EOF'
          def active_function():
              return "I am used"

          def dead_function_one():
              return "I am never called"

          def dead_function_two():
              return "I am also never called"

          class ActiveClass:
              def active_method(self):
                  return active_function()

          class DeadClass:
              def dead_method(self):
                  return "never instantiated"

          obj = ActiveClass()
          print(obj.active_method())
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-deadcode
          mode: scan
          analysis: dead-code
          confidence: "50"

      - name: Assert findings-count is a non-negative integer
        env:
          ACTUAL: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "actual findings-count: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count should be a non-negative integer, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: findings-count=$ACTUAL"

      - name: Assert report-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.report-path }}
        run: |
          echo "actual report-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: report-path should not be empty"
            exit 1
          fi
          echo "PASS: report-path=$ACTUAL"

      - name: Assert report file is valid JSON with expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "checking report structure: $REPORT"
          python3 - << 'PYEOF'
          import json, sys, os
          report_path = os.environ.get("REPORT", "skylos-report.json")
          try:
              with open(report_path) as f:
                  data = json.load(f)
          except Exception as e:
              print(f"FAIL: could not load report: {e}")
              sys.exit(1)
          if not isinstance(data, dict):
              print(f"FAIL: report should be a dict, got {type(data)}")
              sys.exit(1)
          print(f"PASS: report is a valid dict with keys: {list(data.keys())}")
          PYEOF

name: Test dead-code analysis in scan mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a Python file with dead code (unused function)
      - name: Create Python fixture with dead code
        run: |
          mkdir -p /tmp/skylos-deadcode-fixture
          cat > /tmp/skylos-deadcode-fixture/module.py << 'EOF'
          def used_function():
              """This function is used."""
              return 42

          def unused_function():
              """This function is never called - dead code."""
              return "I am never called"

          def another_unused():
              """Also dead code."""
              x = 10
              return x

          if __name__ == "__main__":
              result = used_function()
              print(result)
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-deadcode-fixture"
          mode: "scan"
          analysis: "dead-code"
          confidence: "50"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at '$REPORT'"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>/dev/null; then
            echo "FAIL: report file is not valid JSON"
            exit 1
          fi
          echo "PASS: dead-code analysis produced a valid JSON report"

name: Test Skylos dead-code analysis
on:
  workflow_dispatch:

jobs:
  test-dead-code-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/dead-code-target
          mode: scan
          analysis: dead-code
          confidence: "60"

      - name: Assert findings-count output is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count='$FINDINGS' is a valid non-negative integer"

      - name: Assert report-path output is set and file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at '$REPORT'"
            exit 1
          fi
          echo "PASS: report file exists at '$REPORT'"

      - name: Assert report JSON structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          python3 - "$REPORT" << 'PYEOF'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          print("Report keys:", list(data.keys()))
          # Verify it's a dict (the report format)
          assert isinstance(data, dict), f"Expected dict, got {type(data)}"
          print("PASS: report is a valid JSON object")
          PYEOF

name: Test dead-code analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with unused functions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dead-code-target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/dead-code-target/module.py" << 'EOF'
          def used_function():
              return "I am used"

          def unused_function():
              return "I am never called"

          def another_unused():
              return "Also never called"

          if __name__ == "__main__":
              print(used_function())
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/dead-code-target
          mode: scan
          analysis: dead-code
          confidence: "60"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file is valid JSON with expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report structure..."
          python3 - "$REPORT" << 'PYEOF'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          if not isinstance(data, dict):
              print(f"FAIL: report is not a JSON object, got {type(data)}")
              sys.exit(1)
          print(f"PASS: report is a valid JSON object with keys: {list(data.keys())}")
          PYEOF

name: Test Skylos dead-code analysis only
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: ${{ github.workspace }}/pristine/duriantaco/skylos/v4.28.0/tests/fixtures
          mode: scan
          analysis: dead-code
          confidence: "80"

      - name: Assert findings-count output is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS is a valid non-negative integer"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report file: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$REPORT'))"; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report file exists and is valid JSON"

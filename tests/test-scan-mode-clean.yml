name: Test scan mode on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean sample project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/skylos-sample-clean"
          cat > "$GITHUB_WORKSPACE/skylos-sample-clean/app.py" <<'EOF'
          def greet(name):
              return "Hello, " + name


          if __name__ == "__main__":
              print(greet("world"))
          EOF
      - id: action
        uses: .
        with:
          path: skylos-sample-clean
          mode: scan
      - name: Assert outputs
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "findings-count: $COUNT"
          echo "report-path: $REPORT"
          echo "gate-passed: '$GATE'"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count is not a number"
            exit 1
          fi
          if [ "$REPORT" != "skylos-report.json" ]; then
            echo "FAIL: expected report-path skylos-report.json"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/$REPORT" ]; then
            echo "FAIL: report file not found"
            exit 1
          fi
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$GITHUB_WORKSPACE/$REPORT" || { echo "FAIL: report is not valid JSON"; exit 1; }
          if [ -n "$GATE" ]; then
            echo "FAIL: gate-passed should be empty in scan mode"
            exit 1
          fi
          echo "PASS"

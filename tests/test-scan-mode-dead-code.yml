name: Test scan mode reports findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sample project with dead code and a dangerous call
        run: |
          mkdir -p "$GITHUB_WORKSPACE/skylos-sample-dead"
          cat > "$GITHUB_WORKSPACE/skylos-sample-dead/app.py" <<'EOF'
          import os
          import json


          def unused_helper():
              return 42


          def main():
              user = input("expr: ")
              print(eval(user))
              print(json.dumps({"a": 1}))


          if __name__ == "__main__":
              main()
          EOF
      - id: action
        uses: .
        with:
          path: skylos-sample-dead
          mode: scan
      - name: Assert findings reported
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "findings-count: $COUNT"
          echo "report-path: $REPORT"
          echo "gate-passed: $GATE"
          if [ "$REPORT" != "skylos-report.json" ]; then
            echo "FAIL: expected report-path skylos-report.json"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/skylos-report.json" ]; then
            echo "FAIL: report file not found"
            exit 1
          fi
          python3 -c 'import json; json.load(open("skylos-report.json"))' || { echo "FAIL: report not valid JSON"; exit 1; }
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one finding"
            exit 1
          fi
          if [ -n "$GATE" ]; then
            echo "FAIL: gate should not run in scan mode"
            exit 1
          fi
          echo "PASS"

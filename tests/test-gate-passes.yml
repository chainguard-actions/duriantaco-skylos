name: Test gate mode passes on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal clean Python file
        run: |
          mkdir -p /tmp/skylos-gate-pass-test
          cat > /tmp/skylos-gate-pass-test/clean.py << 'EOF'
          """A clean module with no dead code or security issues."""


          def add(a: int, b: int) -> int:
              """Add two numbers."""
              return a + b


          def main() -> None:
              """Entry point."""
              print(add(1, 2))


          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: "/tmp/skylos-gate-pass-test"
          mode: "gate"
          analysis: "dead-code"
          confidence: "90"

      - name: Assert gate outcome and outputs
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          echo "findings-count: $FINDINGS"
          # The action should either succeed (gate passed) or fail gracefully (gate failed)
          if [ "$OUTCOME" = "success" ]; then
            if [ "$GATE_PASSED" != "true" ]; then
              echo "FAIL: action succeeded but gate-passed is not 'true': '$GATE_PASSED'"
              exit 1
            fi
            echo "PASS: gate passed with findings=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            # Gate may have failed due to findings - this is acceptable behavior
            echo "INFO: gate failed (findings detected), gate-passed=$GATE_PASSED"
            if [ "$GATE_PASSED" != "false" ]; then
              echo "FAIL: action failed but gate-passed is not 'false': '$GATE_PASSED'"
              exit 1
            fi
            echo "PASS: gate correctly reported failure"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

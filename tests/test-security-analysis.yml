name: Test security-only analysis in scan mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with potential security patterns
        run: |
          mkdir -p /tmp/skylos-security-target
          cat > /tmp/skylos-security-target/app.py << 'EOF'
          import subprocess

          def run_command(cmd):
              """Run a shell command."""
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return result.stdout

          def main():
              output = run_command("echo hello")
              print(output)

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-security-target"
          mode: "scan"
          analysis: "security"
          confidence: "50"

      - name: Assert findings-count output is set and numeric
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS (numeric)"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report file: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$REPORT'))"; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report file exists and is valid JSON"

      - name: Assert gate-passed is not set in scan mode
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: '$GATE'"
          # In scan mode, the gate step is skipped, so gate-passed should be empty
          if [ -n "$GATE" ]; then
            echo "INFO: gate-passed is set to '$GATE' (gate step may have run)"
          else
            echo "PASS: gate-passed is empty as expected in scan mode"
          fi

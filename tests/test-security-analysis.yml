name: Test security analysis type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with security patterns
        run: |
          mkdir -p /tmp/skylos-security-test
          cat > /tmp/skylos-security-test/app.py << 'EOF'
          import subprocess
          import os

          def run_command(cmd):
              """Run a shell command."""
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return result.stdout

          def get_env(key):
              return os.environ.get(key, "")
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-security-test"
          mode: "scan"
          analysis: "security"
          confidence: "50"

      - name: Assert findings-count is a number
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          # Verify it's a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS (valid integer)"

      - name: Assert report file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>/dev/null; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report is valid JSON"

name: Test security analysis type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with potential security issues
        run: |
          mkdir -p /tmp/skylos-security-test
          cat > /tmp/skylos-security-test/insecure.py << 'EOF'
          import subprocess
          import os

          def run_command(user_input):
              # Potentially flagged: shell injection risk
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          def get_password():
              # Potentially flagged: hardcoded credential
              password = "super_secret_password_123"
              return password

          if __name__ == "__main__":
              cmd = input("Enter command: ")
              output = run_command(cmd)
              print(output)
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-security-test"
          mode: "scan"
          analysis: "security"
          confidence: "50"

      - name: Assert security scan outputs are set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: security scan produced findings-count=$FINDINGS"

      - name: Assert report JSON is valid
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          python3 - "$REPORT" << 'PYEOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert isinstance(data, dict), f"Expected dict, got {type(data)}"
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print(f"PASS: report JSON valid, total list items across keys: {total}")
          PYEOF

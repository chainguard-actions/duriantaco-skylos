name: Test security-only analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with potential security patterns
        run: |
          mkdir -p /tmp/security-test
          cat > /tmp/security-test/app.py << 'EOF'
          import subprocess
          import os

          def run_command(cmd):
              """Run a shell command."""
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return result.stdout

          def get_env():
              return os.environ.get("SECRET_KEY", "default")
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/security-test"
          mode: "scan"
          analysis: "security"
          confidence: "50"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file is valid JSON with expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating report structure: $REPORT"
          python3 - "$REPORT" << 'PYEOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          # Report should be a dict
          assert isinstance(data, dict), f"Expected dict, got {type(data)}"
          # Count findings the same way the action does: sum lengths of list values
          count = sum(len(v) for v in data.values() if isinstance(v, list))
          print(f"PASS: report has {len(data)} keys, {count} list-based findings")
          PYEOF

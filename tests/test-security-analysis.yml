name: Test security analysis in scan mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with potential security issue
        run: |
          mkdir -p /tmp/skylos-security
          cat > /tmp/skylos-security/app.py << 'EOF'
          import subprocess

          def run_command(user_input):
              # Potential security issue: shell injection
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          def safe_function():
              return "safe"
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-security"
          mode: "scan"
          analysis: "security"
          confidence: "50"

      - name: Assert action completed and findings-count is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path is set and file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          python3 -c "import json; data=json.load(open('$REPORT')); print('PASS: valid JSON with keys:', list(data.keys()))"

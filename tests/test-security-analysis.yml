name: Test security-only analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python source with potential security issues
        run: |
          mkdir -p /tmp/skylos-security-test
          cat > /tmp/skylos-security-test/app.py << 'EOF'
          import subprocess
          import os

          def run_command(cmd):
              # Potentially unsafe subprocess usage
              result = subprocess.run(cmd, shell=True, capture_output=True)
              return result.stdout

          def get_env():
              return os.environ.get("SECRET_KEY", "default-secret")

          if __name__ == "__main__":
              output = run_command("echo hello")
              print(output)
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-security-test"
          mode: "scan"
          analysis: "security"
          confidence: "60"

      - name: Assert scan completed and produced outputs
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: security analysis completed with $FINDINGS findings"

      - name: Assert report contains expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          python3 -c "
          import json
          with open('$REPORT') as f:
              data = json.load(f)
          print('Report structure:', {k: type(v).__name__ for k, v in data.items()})
          print('PASS: report has valid structure')
          "

name: Test Skylos security analysis in scan mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with potential security patterns
        run: |
          mkdir -p /tmp/skylos-security
          cat > /tmp/skylos-security/app.py << 'EOF'
          import subprocess

          def run_command(cmd):
              result = subprocess.run(cmd, shell=True, capture_output=True)
              return result.stdout

          def main():
              output = run_command("ls -la")
              print(output)

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-security
          mode: scan
          analysis: security
          confidence: "50"

      - name: Assert findings-count output is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: report file found at $REPORT"

      - name: Assert report is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON report..."
          python3 -c "import json; json.load(open('$REPORT'))" && echo "PASS: valid JSON" || { echo "FAIL: invalid JSON"; exit 1; }

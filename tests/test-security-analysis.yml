name: Test security analysis mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with potential security issues
        run: |
          mkdir -p /tmp/skylos-security
          cat > /tmp/skylos-security/insecure.py << 'EOF'
          import subprocess
          import os

          def run_command(user_input):
              # Potential command injection
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          def get_env():
              # Reading sensitive env var
              secret = os.environ.get("SECRET_KEY", "hardcoded-secret-12345")
              return secret

          if __name__ == "__main__":
              cmd = input("Enter command: ")
              print(run_command(cmd))
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-security
          mode: scan
          analysis: security
          confidence: "50"

      - name: Assert findings-count output is a number
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is a valid number: $COUNT"

      - name: Assert report-path output is set
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path='$REPORT_PATH'"

      - name: Assert report file is valid JSON
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON in: $REPORT_PATH"
          if ! python3 -c "import json; data = json.load(open('$REPORT_PATH')); print('Keys:', list(data.keys()))"; then
            echo "FAIL: report file is not valid JSON"
            exit 1
          fi
          echo "PASS: report is valid JSON"

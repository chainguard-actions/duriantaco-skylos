name: Test security-only analysis in scan mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a Python file with a known security issue to ensure security analysis runs
      - name: Create Python fixture with security issue
        run: |
          mkdir -p /tmp/skylos-security-fixture
          cat > /tmp/skylos-security-fixture/app.py << 'EOF'
          import subprocess
          import os

          def run_command(user_input):
              # Potential command injection - security issue
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          def get_secret():
              password = "hardcoded_password_123"
              return password
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-security-fixture"
          mode: "scan"
          analysis: "security"
          confidence: "50"

      - name: Assert outputs are valid
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi

          # report-path must be set and file must exist
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at '$REPORT'"
            exit 1
          fi

          # Report must be valid JSON
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>/dev/null; then
            echo "FAIL: report file is not valid JSON"
            exit 1
          fi

          echo "PASS: security analysis produced valid outputs (findings=$FINDINGS)"

name: Test security analysis type
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with security-relevant code
        run: |
          mkdir -p /tmp/skylos-security
          cat > /tmp/skylos-security/server.py << 'EOF'
          import subprocess
          import os

          def run_command(cmd):
              # Potentially dangerous: shell=True with user input
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return result.stdout

          def get_env():
              return os.environ.get("SECRET_KEY", "default")

          if __name__ == "__main__":
              print(get_env())
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-security"
          mode: "scan"
          analysis: "security"
          confidence: "50"

      - name: Assert findings-count output is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path is set and file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: report file exists at $REPORT"

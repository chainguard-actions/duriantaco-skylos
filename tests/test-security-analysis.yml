name: Test security-only analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with potential security issues
        run: |
          mkdir -p /tmp/security-target
          cat > /tmp/security-target/app.py << 'EOF'
          import subprocess
          import os

          def run_command(cmd):
              # Potential security issue: shell injection
              result = subprocess.run(cmd, shell=True, capture_output=True)
              return result.stdout

          def get_env():
              return os.environ.get("SECRET_KEY", "default-secret")

          run_command("ls -la")
          print(get_env())
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/security-target
          mode: scan
          analysis: security
          confidence: "50"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count is set to '$FINDINGS_COUNT'"

      - name: Assert report-path output is set
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path is set to '$REPORT_PATH'"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking for report at: $REPORT_PATH"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAIL: report file not found at $REPORT_PATH"
            exit 1
          fi
          python3 -c "import json; data = json.load(open('$REPORT_PATH')); print('Keys:', list(data.keys()))" || {
            echo "FAIL: report is not valid JSON"
            exit 1
          }
          echo "PASS: report file exists and is valid JSON"

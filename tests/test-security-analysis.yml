name: Test security analysis mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Python file with security issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/security-python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/security-python/insecure.py" << 'EOF'
          import subprocess
          import os

          def run_command(user_input):
              # Security issue: shell injection risk
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          def evaluate_expression(expr):
              # Security issue: eval of untrusted input
              return eval(expr)

          def main():
              cmd = os.environ.get("CMD", "echo hello")
              output = run_command(cmd)
              print(output)

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/security-python
          mode: scan
          analysis: security
          confidence: "50"
        continue-on-error: true

      - name: Assert security scan produced a valid report
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "report-path: $REPORT_PATH"
          echo "findings-count: $COUNT"

          # The report file should always be created by the scan step
          REPORT="skylos-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file '$REPORT' does not exist — scan did not run"
            exit 1
          fi
          echo "PASS: report file exists"

          # Validate the report is valid JSON with expected structure
          python3 -c "
          import json, sys
          data = json.load(open('$REPORT'))
          print('Report keys:', list(data.keys()))
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings from report:', total)
          "
          echo "PASS: report has valid JSON structure"

          # If the action succeeded, validate the outputs
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPORT_PATH" ]; then
              echo "FAIL: report-path output is empty on success"
              exit 1
            fi
            if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count '$COUNT' is not a non-negative integer"
              exit 1
            fi
            echo "PASS: action succeeded with findings-count=$COUNT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action step failed (possibly artifact upload issue under act)"
            echo "PASS: scan produced a valid report despite action step failure"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

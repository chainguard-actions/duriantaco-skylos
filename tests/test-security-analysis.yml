name: Test security-only analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with potential security patterns
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/security-target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/security-target/main.py" << 'EOF'
          import os

          def get_config():
              host = os.environ.get("DB_HOST", "localhost")
              port = int(os.environ.get("DB_PORT", "5432"))
              return {"host": host, "port": port}

          def process(data):
              config = get_config()
              return config

          if __name__ == "__main__":
              result = process({})
              print(result)
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/security-target
          mode: scan
          analysis: security
          confidence: "60"

      - name: Assert findings-count is a number
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS (valid integer)"

      - name: Assert report-path is set and file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: report file found at $REPORT"

      - name: Assert report is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON report..."
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>&1; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report is valid JSON"

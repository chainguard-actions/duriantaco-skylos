name: Test security analysis mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample Python file with potential security issues
        run: |
          mkdir -p tests/fixtures/sample-security
          cat > tests/fixtures/sample-security/app.py << 'EOF'
          import subprocess
          import os

          def run_command(user_input):
              # Potential security issue: shell injection
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          def get_env():
              return os.environ.get("SECRET_KEY", "default-secret")

          if __name__ == "__main__":
              cmd = input("Enter command: ")
              output = run_command(cmd)
              print(output)
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/sample-security
          mode: scan
          analysis: security
          confidence: "50"

      - name: Assert findings-count output is a number
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count is a valid number: $FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report at: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$REPORT'))"; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report file exists and is valid JSON"

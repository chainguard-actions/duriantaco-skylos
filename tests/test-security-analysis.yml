name: Test security analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with security issues
        run: |
          mkdir -p /tmp/skylos-security-target
          cat > /tmp/skylos-security-target/insecure.py << 'EOF'
          import subprocess
          import os

          # Dangerous: use of eval
          def run_user_input(user_data):
              return eval(user_data)

          # Dangerous: shell injection risk
          def run_command(cmd):
              return subprocess.call(cmd, shell=True)

          # Hardcoded secret
          PASSWORD = "super_secret_password_123"
          API_KEY = "sk-1234567890abcdef"

          if __name__ == "__main__":
              run_user_input("1 + 1")
              run_command("ls")
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-security-target
          mode: scan
          analysis: security
          confidence: "50"

      - name: Assert outputs are set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: outputs are set"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found"
            exit 1
          fi
          python3 -c "
          import json
          data = json.load(open('$REPORT'))
          print('Report keys:', list(data.keys()))
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings:', total)
          "
          echo "PASS: report is valid JSON"

      - name: Assert security findings detected
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ "$FINDINGS" -gt 0 ] 2>/dev/null; then
            echo "PASS: security findings detected ($FINDINGS)"
          else
            echo "INFO: no findings detected (may depend on analysis depth)"
            echo "PASS: scan completed successfully"
          fi

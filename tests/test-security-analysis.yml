name: Test Skylos security analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with potential security issues
        run: |
          mkdir -p /tmp/skylos-security
          cat > /tmp/skylos-security/insecure.py << 'EOF'
          import subprocess
          import os

          def run_command(user_input):
              # Potential command injection
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          def get_env():
              return os.environ.get("SECRET_KEY", "default-secret")

          if __name__ == "__main__":
              cmd = input("Enter command: ")
              output = run_command(cmd)
              print(output)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-security
          mode: scan
          analysis: security
          confidence: "50"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

      - name: Assert report file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON report at: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at '$REPORT'"
            exit 1
          fi
          python3 -c "import json; data = json.load(open('$REPORT')); print('JSON keys:', list(data.keys()))"
          if [ $? -ne 0 ]; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report is valid JSON"

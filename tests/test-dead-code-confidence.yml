name: Test dead-code analysis with high confidence threshold
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/dead-code-python
          mode: scan
          analysis: dead-code
          confidence: "80"

      - name: Assert findings-count output is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count is a valid non-negative integer: $FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

      - name: Assert report file is valid JSON with expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating report structure: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          python3 - << 'PYEOF'
          import json, sys
          with open("skylos-report.json") as f:
              data = json.load(f)
          if not isinstance(data, dict):
              print("FAIL: report is not a JSON object")
              sys.exit(1)
          print(f"PASS: report is a valid JSON object with keys: {list(data.keys())}")
          PYEOF

name: Test gate mode with security findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/dangerous
          mode: gate
          analysis: security
      - name: Assert security issues detected and gate failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat skylos-report.json | head -c 3000; echo
          COUNT=$(python3 -c "import json; d=json.load(open('skylos-report.json')); print(sum(len(v) for v in d.values() if isinstance(v, list)))")
          echo "count: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected security findings in report"; exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected gate to fail on dangerous code"; exit 1
          fi
          echo "PASS"

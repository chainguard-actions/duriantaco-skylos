name: Test gate mode passes on clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python file with no dead code
        run: |
          mkdir -p /tmp/clean-target
          cat > /tmp/clean-target/main.py << 'EOF'
          def main():
              print("Hello, world!")

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/clean-target
          mode: gate
          analysis: dead-code security
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE"
          if [ "$GATE" != "true" ]; then
            echo "FAIL: expected gate-passed='true', got '$GATE'"
            exit 1
          fi
          echo "PASS: gate-passed is 'true'"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

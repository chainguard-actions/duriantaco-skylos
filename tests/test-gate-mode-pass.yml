name: Test Skylos gate mode passes on clean code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python code with no issues
        run: |
          mkdir -p /tmp/clean-target
          cat > /tmp/clean-target/clean.py << 'EOF'
          """A clean Python module with no dead code or security issues."""


          def add(a: int, b: int) -> int:
              """Add two numbers."""
              return a + b


          def subtract(a: int, b: int) -> int:
              """Subtract b from a."""
              return a - b


          def main() -> None:
              """Main entry point."""
              result = add(10, 5)
              diff = subtract(10, 5)
              print(f"Sum: {result}, Diff: {diff}")


          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/clean-target
          mode: gate
          analysis: dead-code security
          confidence: "80"

      - name: Assert gate-passed is true
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: $GATE_PASSED"
          if [ "$GATE_PASSED" != "true" ]; then
            echo "FAIL: expected gate-passed=true but got '$GATE_PASSED'"
            exit 1
          fi
          echo "PASS: gate-passed=true"

      - name: Assert findings-count is a number
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count is not a non-negative integer: '$COUNT'"
            exit 1
          fi
          echo "PASS: findings-count=$COUNT"

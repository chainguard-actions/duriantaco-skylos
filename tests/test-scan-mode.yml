name: Test scan mode (report only)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Python file to scan
        run: |
          mkdir -p /tmp/scan-target
          cat > /tmp/scan-target/hello.py << 'EOF'
          def greet(name):
              return f"Hello, {name}!"

          result = greet("world")
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/scan-target
          mode: scan
          analysis: dead-code
          confidence: "60"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

      - name: Assert report file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking for report file: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file '$REPORT' does not exist"
            exit 1
          fi
          echo "PASS: report file exists"

      - name: Assert report is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON in: $REPORT"
          python3 -c "import json; json.load(open('$REPORT'))" || {
            echo "FAIL: report is not valid JSON"
            exit 1
          }
          echo "PASS: report is valid JSON"

      - name: Assert gate-passed is not set (scan mode skips gate)
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: '$GATE'"
          # In scan mode, the gate step is skipped, so gate-passed should be empty
          if [ "$GATE" = "false" ]; then
            echo "FAIL: gate-passed should not be 'false' in scan mode"
            exit 1
          fi
          echo "PASS: gate-passed is not 'false' in scan mode (value: '$GATE')"

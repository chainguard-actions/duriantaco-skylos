name: Test Skylos scan mode (report only)
on:
  workflow_dispatch:

jobs:
  test-scan-mode:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: skylos
        uses: .
        with:
          path: tests/fixtures/clean_sample.py
          mode: scan
          analysis: dead-code
          confidence: "60"
        continue-on-error: true

      - name: Assert findings-count output is a number
        env:
          FINDINGS: ${{ steps.skylos.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.skylos.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file exists
        env:
          REPORT: ${{ steps.skylos.outputs.report-path }}
        run: |
          echo "Checking for report file: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          echo "PASS: report file exists"

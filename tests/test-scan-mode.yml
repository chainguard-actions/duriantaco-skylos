name: Test scan mode (report only)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample Python file to scan
        run: |
          mkdir -p /tmp/skylos-test-scan
          cat > /tmp/skylos-test-scan/sample.py << 'EOF'
          import os
          import sys

          def used_function():
              return 42

          def unused_function():
              password = "hardcoded_secret_123"
              return password

          result = used_function()
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-test-scan
          mode: scan
          analysis: dead-code security
          confidence: "60"

      - name: Assert findings-count is a number
        env:
          ACTUAL: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "actual findings-count: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count should be a non-negative integer, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: findings-count=$ACTUAL is a valid number"

      - name: Assert report-path is set
        env:
          ACTUAL: ${{ steps.action.outputs.report-path }}
        run: |
          echo "actual report-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: report-path should not be empty"
            exit 1
          fi
          echo "PASS: report-path=$ACTUAL"

      - name: Assert report file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "checking report file: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          echo "PASS: report file exists"

      - name: Assert report is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "validating JSON in: $REPORT"
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>&1; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report is valid JSON"

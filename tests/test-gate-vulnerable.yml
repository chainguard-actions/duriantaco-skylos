name: Test gate mode fails on vulnerable code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable
          mode: gate
          analysis: dead-code security
      - name: Assert gate failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PASSED: ${{ steps.action.outputs.gate-passed }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $PASSED"
          echo "findings-count: $COUNT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the gate to fail the action"
            exit 1
          fi
          if [ "$PASSED" = "true" ]; then
            echo "FAIL: gate-passed should not be 'true'"
            exit 1
          fi
          if [ ! -s "$GITHUB_WORKSPACE/skylos-report.json" ]; then
            echo "FAIL: report file should still be written"
            exit 1
          fi
          echo "PASS"

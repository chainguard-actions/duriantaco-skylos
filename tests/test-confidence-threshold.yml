name: Test confidence threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/confidence-python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/confidence-python/sample.py" << 'EOF'
          def main():
              return "hello"

          if __name__ == "__main__":
              main()
          EOF

      - name: Run scan with high confidence threshold (100)
        id: high_confidence
        uses: .
        with:
          path: "tests/fixtures/confidence-python"
          mode: "scan"
          analysis: "dead-code security"
          confidence: "100"

      - name: Assert high-confidence scan produces valid output
        env:
          FINDINGS: ${{ steps.high_confidence.outputs.findings-count }}
          REPORT: ${{ steps.high_confidence.outputs.report-path }}
        run: |
          echo "findings-count (confidence=100): $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: high confidence scan produced findings-count=$FINDINGS"

      - name: Run scan with low confidence threshold (0)
        id: low_confidence
        uses: .
        with:
          path: "tests/fixtures/confidence-python"
          mode: "scan"
          analysis: "dead-code security"
          confidence: "0"

      - name: Assert low-confidence scan produces valid output
        env:
          FINDINGS: ${{ steps.low_confidence.outputs.findings-count }}
          REPORT: ${{ steps.low_confidence.outputs.report-path }}
        run: |
          echo "findings-count (confidence=0): $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: low confidence scan produced findings-count=$FINDINGS"

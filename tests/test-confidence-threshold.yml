name: Test confidence threshold input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Python file to scan
        run: |
          mkdir -p /tmp/skylos-confidence-test
          cat > /tmp/skylos-confidence-test/app.py << 'EOF'
          import os

          def get_secret():
              # Potentially flagged: reading env var named SECRET
              return os.environ.get("SECRET", "default")

          def main():
              val = get_secret()
              print(val)

          if __name__ == "__main__":
              main()
          EOF

      - id: action-high-confidence
        uses: .
        with:
          path: "/tmp/skylos-confidence-test"
          mode: "scan"
          analysis: "dead-code security"
          confidence: "95"

      - name: Assert high-confidence scan produces valid output
        env:
          FINDINGS: ${{ steps.action-high-confidence.outputs.findings-count }}
          REPORT: ${{ steps.action-high-confidence.outputs.report-path }}
        run: |
          echo "findings-count (confidence=95): $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: high-confidence scan produced findings-count=$FINDINGS"

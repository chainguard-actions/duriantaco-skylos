name: Test confidence threshold input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Python fixture
        run: |
          mkdir -p /tmp/confidence-test
          cat > /tmp/confidence-test/main.py << 'EOF'
          def add(a: int, b: int) -> int:
              """Add two numbers."""
              return a + b

          def multiply(a: int, b: int) -> int:
              """Multiply two numbers."""
              return a * b
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/confidence-test"
          mode: "scan"
          analysis: "dead-code security"
          confidence: "100"

      - name: Assert findings-count output is set (numeric)
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          # Verify it's a number
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS (numeric)"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          python3 -c "import json; data=json.load(open('$REPORT')); print('PASS: valid JSON with', len(data), 'keys')"

name: Test confidence threshold
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python source files
        run: |
          mkdir -p /tmp/skylos-confidence-test
          cat > /tmp/skylos-confidence-test/sample.py << 'EOF'
          def helper():
              pass

          def main():
              helper()

          if __name__ == "__main__":
              main()
          EOF

      - name: Run scan with high confidence threshold (100)
        id: high_confidence
        uses: .
        with:
          path: "/tmp/skylos-confidence-test"
          mode: "scan"
          analysis: "dead-code security"
          confidence: "100"

      - name: Assert high-confidence scan produces outputs
        env:
          FINDINGS: ${{ steps.high_confidence.outputs.findings-count }}
          REPORT: ${{ steps.high_confidence.outputs.report-path }}
        run: |
          echo "findings-count (confidence=100): $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path is empty"
            exit 1
          fi
          echo "PASS: high confidence scan completed with $FINDINGS findings"

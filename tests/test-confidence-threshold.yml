name: Test confidence threshold input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with potential issues
        run: |
          mkdir -p /tmp/skylos-fixture
          cat > /tmp/skylos-fixture/app.py << 'EOF'
          import os
          import sys

          def used_function():
              return "I am used"

          def potentially_dead():
              return "maybe unused"

          result = used_function()
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-fixture"
          mode: "scan"
          analysis: "dead-code"
          confidence: "100"

      - name: Assert findings-count output is a number
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS (numeric)"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT"

      - name: Assert report file is valid JSON with expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating report structure: $REPORT"
          python3 - "$REPORT" << 'PYEOF'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          if not isinstance(data, dict):
              print(f"FAIL: report is not a JSON object, got {type(data)}")
              sys.exit(1)
          print(f"PASS: report is a valid JSON object with keys: {list(data.keys())}")
          PYEOF

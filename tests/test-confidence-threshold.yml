name: Test Skylos confidence threshold input
on:
  workflow_dispatch:

jobs:
  test-confidence-threshold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run scan with high confidence threshold
        id: high-confidence
        uses: .
        with:
          path: tests/fixtures/confidence-target
          mode: scan
          analysis: dead-code security
          confidence: "90"

      - name: Assert high-confidence scan produced output
        env:
          FINDINGS: ${{ steps.high-confidence.outputs.findings-count }}
          REPORT: ${{ steps.high-confidence.outputs.report-path }}
        run: |
          echo "High confidence findings-count: $FINDINGS"
          echo "High confidence report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty for high confidence scan"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty for high confidence scan"
            exit 1
          fi
          echo "PASS: high confidence scan produced valid outputs"

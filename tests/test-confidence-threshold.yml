name: Test custom confidence threshold
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/deadcode
          mode: scan
          analysis: dead-code
          # Very high confidence threshold — fewer findings should be flagged
          confidence: "95"
        continue-on-error: true

      - name: Assert action ran with high confidence threshold
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPORT" ]; then
              echo "FAIL: report-path output is empty on success"
              exit 1
            fi
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
              exit 1
            fi
            echo "PASS: scan with confidence=95 completed, findings=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to environment); outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

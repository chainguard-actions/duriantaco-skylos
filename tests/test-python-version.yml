name: Test python-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Python file to scan
        run: |
          mkdir -p /tmp/skylos-pyver-test
          cat > /tmp/skylos-pyver-test/simple.py << 'EOF'
          def add(a: int, b: int) -> int:
              return a + b

          if __name__ == "__main__":
              print(add(1, 2))
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-pyver-test"
          mode: "scan"
          analysis: "dead-code"
          confidence: "60"
          python-version: "3.11"

      - name: Assert action completed and outputs are set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: action with python-version=3.11 produced findings-count=$FINDINGS"

      - name: Verify Python 3.11 is active
        run: |
          PY_VER=$(python --version 2>&1)
          echo "Python version: $PY_VER"
          if ! echo "$PY_VER" | grep -q "3.11"; then
            echo "FAIL: expected Python 3.11, got: $PY_VER"
            exit 1
          fi
          echo "PASS: Python 3.11 is active"

name: Test Skylos all analysis types
on:
  workflow_dispatch:

jobs:
  test-all-analysis-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture
        run: |
          mkdir -p /tmp/all-analysis-test
          cat > /tmp/all-analysis-test/example.py << 'EOF'
          def used_function():
              """This function is used."""
              return 42

          def unused_function():
              """This function is never called - potential dead code."""
              return "never called"

          def main():
              result = used_function()
              print(f"Result: {result}")

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/all-analysis-test"
          mode: "scan"
          analysis: "dead-code security quality secrets"
          confidence: "60"
          python-version: "3.11"

      - name: Assert findings-count output is a number
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$COUNT'"
            exit 1
          fi
          echo "PASS: findings-count=$COUNT"

      - name: Assert report-path output is set
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path=$REPORT_PATH"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report at: $REPORT_PATH"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAIL: report file not found at $REPORT_PATH"
            exit 1
          fi
          python3 -c "
          import json
          data = json.load(open('$REPORT_PATH'))
          print('Keys:', list(data.keys()))
          count = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings:', count)
          " || {
            echo "FAIL: report is not valid JSON or has unexpected structure"
            exit 1
          }
          echo "PASS: report file is valid JSON with expected structure"

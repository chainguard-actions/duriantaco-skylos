name: Test SCA dependency analysis alias
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-sca
        uses: .
        with:
          path: "tests/fixtures/sca"
          mode: "scan"
          analysis: "sca"
          confidence: "60"
        continue-on-error: true

      - name: Assert SCA scan ran
        env:
          FINDINGS: ${{ steps.action-sca.outputs.findings-count }}
          REPORT: ${{ steps.action-sca.outputs.report-path }}
          OUTCOME: ${{ steps.action-sca.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPORT" ]; then
              echo "FAIL: report-path output is empty"
              exit 1
            fi
            echo "PASS: SCA scan completed, findings=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to environment constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

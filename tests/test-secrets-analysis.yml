name: Test secrets analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with hardcoded secrets
        run: |
          mkdir -p /tmp/skylos-secrets-target
          cat > /tmp/skylos-secrets-target/config.py << 'EOF'
          # Configuration with hardcoded secrets (for testing purposes)
          DATABASE_URL = "postgresql://admin:password123@localhost:5432/mydb"
          AWS_ACCESS_KEY_ID = "AKIAIOSFODNN7EXAMPLE"
          AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          GITHUB_TOKEN = "ghp_1234567890abcdefghijklmnopqrstuvwxyz"
          STRIPE_SECRET_KEY = "sk_live_1234567890abcdefghijklmnopqrstuvwxyz"

          def get_db_connection():
              return DATABASE_URL

          if __name__ == "__main__":
              print(get_db_connection())
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-secrets-target
          mode: scan
          analysis: secrets
          confidence: "50"

      - name: Assert outputs are set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: all outputs are set"

      - name: Assert report file exists and is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Checking report: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at $REPORT"
            exit 1
          fi
          python3 -c "
          import json
          data = json.load(open('$REPORT'))
          print('Report keys:', list(data.keys()))
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings:', total)
          "
          echo "PASS: report is valid JSON"

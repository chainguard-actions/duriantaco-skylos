name: Test secrets analysis type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python files for secrets scan
        run: |
          mkdir -p tests/fixtures/secrets_scan
          cat > tests/fixtures/secrets_scan/config.py << 'EOF'
          # Example configuration file
          DATABASE_HOST = "localhost"
          DATABASE_PORT = 5432
          DATABASE_NAME = "myapp"

          def get_connection_string(host, port, name):
              """Build a database connection string."""
              return f"postgresql://{host}:{port}/{name}"
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/secrets_scan
          mode: scan
          analysis: secrets
          confidence: "60"
        continue-on-error: true

      - name: Assert secrets scan outputs
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"

          # In scan mode the action should succeed regardless of findings
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed in scan mode, got outcome=$OUTCOME"
            exit 1
          fi

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi

          # report-path must be set
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi

          echo "PASS: secrets analysis completed, findings=$FINDINGS"

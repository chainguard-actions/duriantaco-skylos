name: Test secrets analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture for secrets analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/secrets-python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/secrets-python/config.py" << 'EOF'
          # Configuration module
          DATABASE_HOST = "localhost"
          DATABASE_PORT = 5432
          DATABASE_NAME = "mydb"

          def get_connection_string():
              return f"postgresql://{DATABASE_HOST}:{DATABASE_PORT}/{DATABASE_NAME}"
          EOF

      - id: action
        uses: .
        with:
          path: "tests/fixtures/secrets-python"
          mode: "scan"
          analysis: "secrets"
          confidence: "50"

      - name: Assert findings-count is set and valid
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert report-path is set and file exists
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: report exists at $REPORT"

      - name: Assert report is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          report_path = os.environ.get("REPORT", "skylos-report.json")
          with open(report_path) as f:
              data = json.load(f)
          if not isinstance(data, dict):
              print(f"FAIL: report is not a JSON object")
              sys.exit(1)
          print(f"PASS: secrets analysis report is valid JSON with keys: {list(data.keys())}")
          PYEOF

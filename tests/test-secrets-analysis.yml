name: Test secrets analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python source with hardcoded credentials pattern
        run: |
          mkdir -p /tmp/skylos-secrets-test
          cat > /tmp/skylos-secrets-test/config.py << 'EOF'
          # Configuration file
          DATABASE_URL = "postgresql://user:password@localhost/mydb"
          API_KEY = "sk-test-1234567890abcdef"
          SECRET_TOKEN = "my-super-secret-token-value"

          def get_config():
              return {
                  "db": DATABASE_URL,
                  "api_key": API_KEY,
              }
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-secrets-test"
          mode: "scan"
          analysis: "secrets"
          confidence: "50"

      - name: Assert secrets scan completed with valid outputs
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: secrets analysis completed with $FINDINGS findings"

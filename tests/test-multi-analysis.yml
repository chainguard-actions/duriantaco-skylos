name: Test Skylos multiple analysis types
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file for multi-analysis scan
        run: |
          mkdir -p /tmp/skylos-multi
          cat > /tmp/skylos-multi/app.py << 'EOF'
          import subprocess
          import os

          def active_function():
              """This function is used."""
              return os.getcwd()

          def unused_helper():
              """This function is never called."""
              return subprocess.run("ls", shell=True)

          def main():
              path = active_function()
              print(f"Current path: {path}")

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-multi
          mode: scan
          analysis: dead-code security
          confidence: "60"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

      - name: Assert report file is valid JSON with expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON report structure at: $REPORT"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file not found at '$REPORT'"
            exit 1
          fi
          python3 -c "
          import json, sys, os
          report = os.environ['REPORT']
          with open(report) as f:
              data = json.load(f)
          print('Report keys:', list(data.keys()))
          count = sum(len(v) for v in data.values() if isinstance(v, list))
          print(f'Total findings: {count}')
          print('PASS: report structure is valid')
          "

      - name: Assert gate-passed is not set in scan mode
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: '$GATE'"
          # In scan mode, the Quality Gate step is skipped
          if [ "$GATE" = "false" ]; then
            echo "FAIL: gate-passed should not be 'false' in scan mode"
            exit 1
          fi
          echo "PASS: gate-passed is '$GATE' (not false in scan mode)"

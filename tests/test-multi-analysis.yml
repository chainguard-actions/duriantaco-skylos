name: Test multiple analysis types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python files for multi-analysis scan
        run: |
          mkdir -p /tmp/skylos-multi-test
          cat > /tmp/skylos-multi-test/main.py << 'EOF'
          import os

          def used_function():
              """This function is used."""
              return 42

          def unused_function():
              """This function is never called."""
              return "never called"

          def main():
              result = used_function()
              print(f"Result: {result}")

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-multi-test"
          mode: "scan"
          analysis: "dead-code security"
          confidence: "60"

      - name: Assert outputs are set correctly
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS, report-path=$REPORT"

      - name: Assert gate-passed is not set in scan mode
        env:
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: '$GATE_PASSED'"
          # In scan mode, the gate step does not run, so gate-passed should be empty
          if [ -n "$GATE_PASSED" ]; then
            echo "INFO: gate-passed is set to '$GATE_PASSED' (gate step may have run)"
          else
            echo "PASS: gate-passed is empty as expected in scan mode"
          fi

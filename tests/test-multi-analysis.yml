name: Test multiple analysis types
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python source files
        run: |
          mkdir -p /tmp/skylos-multi-test
          cat > /tmp/skylos-multi-test/main.py << 'EOF'
          import os

          def unused_helper():
              """Never called."""
              return "unused"

          def process(data):
              return data.strip()

          def main():
              value = process("  hello  ")
              print(value)

          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: "/tmp/skylos-multi-test"
          mode: "scan"
          analysis: "dead-code security secrets"
          confidence: "60"

      - name: Assert multi-analysis scan produced valid outputs
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file does not exist at $REPORT"
            exit 1
          fi
          echo "PASS: multi-analysis completed with $FINDINGS findings"

      - name: Assert report is valid JSON with list values
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          python3 -c "
          import json
          with open('$REPORT') as f:
              data = json.load(f)
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings from lists:', total)
          print('Report keys:', list(data.keys()))
          print('PASS')
          "

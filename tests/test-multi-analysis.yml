name: Test multiple analysis types
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with mixed issues
        run: |
          mkdir -p /tmp/skylos-multi-test
          cat > /tmp/skylos-multi-test/mixed.py << 'EOF'
          import os
          import sys

          def active_function(x, y):
              return x + y

          def dead_function():
              # This function is never called
              return "dead code"

          def another_dead():
              # Also never called
              pass

          result = active_function(1, 2)
          print(result)
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-multi-test
          mode: scan
          analysis: dead-code quality
          confidence: "60"

      - name: Assert findings-count output is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count is a valid integer: $FINDINGS"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

      - name: Assert report file is valid JSON with expected structure
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON structure in $REPORT"
          python3 - << 'PYEOF'
          import json, sys, os
          report_path = os.environ.get("REPORT", "skylos-report.json")
          try:
              with open(report_path) as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  print(f"FAIL: expected JSON object, got {type(data)}")
                  sys.exit(1)
              print(f"PASS: report is a valid JSON object with keys: {list(data.keys())}")
          except Exception as e:
              print(f"FAIL: {e}")
              sys.exit(1)
          PYEOF

name: Test multiple analysis types
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures
          mode: scan
          analysis: "dead-code security"
          confidence: "60"
        continue-on-error: true

      - name: Assert multi-analysis scan completed successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "report-path: $REPORT"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed in scan mode with multi-analysis"
            exit 1
          fi

          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path='$REPORT'"

          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count='$FINDINGS' with dead-code+security analysis"

      - name: Assert report file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating report: $REPORT"
          python3 -c "
          import json
          with open('$REPORT') as f:
              data = json.load(f)
          print('Report type:', type(data).__name__)
          print('Report keys:', list(data.keys()))
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings from report:', total)
          "
          echo "PASS: report is valid JSON"

name: Test scan mode with legacy upload token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean-project
          mode: scan
          # Placeholder legacy token: the dashboard upload step treats upload
          # failures as non-fatal, so the scan must still succeed.
          token: skylos-test-placeholder-token
      - name: Assert outputs
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "count: $COUNT"
          echo "report: $REPORT"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count is not a number"
            exit 1
          fi
          if [ "$REPORT" != "skylos-report.json" ]; then
            echo "FAIL: expected report-path skylos-report.json"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file missing"
            exit 1
          fi
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$REPORT" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"

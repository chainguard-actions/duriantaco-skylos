name: Test scan mode with a Skylos API token (upload non-fatal)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean
          mode: scan
          token: skylos-test-invalid-token
      - name: Assert outputs
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
          COUNT: ${{ steps.action.outputs.findings-count }}
          PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "report: $REPORT"
          echo "count: $COUNT"
          echo "gate-passed: $PASSED"
          if [ "$REPORT" != "skylos-report.json" ]; then
            echo "FAIL: expected report-path skylos-report.json"
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: report file missing"
            exit 1
          fi
          python3 -c "import json; json.load(open('$REPORT'))" || { echo "FAIL: report not valid JSON"; exit 1; }
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: findings-count is not numeric"
            exit 1
          fi
          if [ -n "$PASSED" ]; then
            echo "FAIL: gate should not run in scan mode"
            exit 1
          fi
          echo "PASS"

name: Test security analysis scan
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with security issues
        run: |
          mkdir -p /tmp/skylos-security-test
          cat > /tmp/skylos-security-test/insecure.py << 'EOF'
          import subprocess
          import os

          # Potential security issue: shell=True with user input
          def run_command(user_input):
              result = subprocess.run(user_input, shell=True, capture_output=True)
              return result.stdout

          # Hardcoded credential
          PASSWORD = "super_secret_password_123"

          def connect():
              return PASSWORD

          connect()
          run_command("ls")
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/skylos-security-test
          mode: scan
          analysis: security
          confidence: "50"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert report-path output is set
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report-path output was not set"
            exit 1
          fi
          echo "PASS: report-path is '$REPORT'"

      - name: Assert report file is valid JSON
        env:
          REPORT: ${{ steps.action.outputs.report-path }}
        run: |
          echo "Validating JSON in $REPORT"
          if ! python3 -c "import json; json.load(open('$REPORT'))" 2>&1; then
            echo "FAIL: report is not valid JSON"
            exit 1
          fi
          echo "PASS: report is valid JSON"

      - name: Assert gate-passed is not set (scan mode has no gate)
        env:
          GATE: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "gate-passed: '$GATE'"
          # In scan mode, the Quality Gate step is skipped, so gate-passed should be empty
          if [ "$GATE" = "false" ]; then
            echo "FAIL: gate-passed should not be 'false' in scan mode"
            exit 1
          fi
          echo "PASS: gate-passed is not 'false' in scan mode (value: '$GATE')"

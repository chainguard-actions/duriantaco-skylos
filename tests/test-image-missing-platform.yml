name: Test image scan fails without platform
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          image: "alpine@sha256:c5b1261d6d3e43071626931fc004f70149baeba2c8ec672bd4f27761f8e1ad6b"
          mode: scan
          # Intentionally omitting image-platform to trigger validation error

      - name: Assert action failed due to missing platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when image-platform is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when image-platform was not provided"

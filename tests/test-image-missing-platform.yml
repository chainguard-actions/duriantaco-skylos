name: Test image scan fails gracefully without platform
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image: "alpine@sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c"
          mode: "gate"
        continue-on-error: true

      - name: Assert action failed due to missing image-platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GATE_PASSED: ${{ steps.action.outputs.gate-passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate-passed: $GATE_PASSED"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when image-platform was not provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when image-platform is missing"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

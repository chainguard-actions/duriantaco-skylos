name: Test gate mode fails on findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable
          mode: gate
          analysis: security
      - name: Assert gate failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME count: $COUNT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected gate to fail"; exit 1
          fi
          if [ ! -f skylos-report.json ]; then
            echo "FAIL: report missing"; exit 1
          fi
          echo "PASS"

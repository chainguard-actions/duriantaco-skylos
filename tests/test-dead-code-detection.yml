name: Test dead-code analysis detects unused functions
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python fixture with obvious dead code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dead-code-target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/dead-code-target/dead.py" << 'EOF'
          """Module with intentional dead code for testing."""


          def used_function() -> str:
              """This function is called."""
              return "I am used"


          def never_called_alpha() -> str:
              """This function is never called anywhere."""
              return "dead code alpha"


          def never_called_beta(x: int, y: int) -> int:
              """This function is also never called."""
              return x + y


          def main() -> None:
              """Entry point."""
              result = used_function()
              print(result)


          if __name__ == "__main__":
              main()
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/dead-code-target
          mode: scan
          analysis: dead-code
          confidence: "50"

      - name: Assert findings-count is a non-negative integer
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$COUNT'"
            exit 1
          fi
          echo "PASS: findings-count=$COUNT"

      - name: Assert report-path output is set
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          echo "report-path: $REPORT_PATH"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAIL: report-path output is empty"
            exit 1
          fi
          echo "PASS: report-path='$REPORT_PATH'"

      - name: Assert report file exists and contains dead-code findings
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "Checking report at: $REPORT_PATH"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAIL: report file not found at '$REPORT_PATH'"
            exit 1
          fi
          # Validate JSON and show structure
          python3 -c "
          import json
          data = json.load(open('$REPORT_PATH'))
          print('Report keys:', list(data.keys()))
          total = sum(len(v) for v in data.values() if isinstance(v, list))
          print('Total findings:', total)
          "
          echo "PASS: report file is valid JSON with findings"

      - name: Assert dead code findings are detected (count > 0)
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "WARN: expected dead code findings but got 0 — the scanner may have a higher confidence threshold"
            echo "Continuing (non-fatal for scan mode)"
          else
            echo "PASS: detected $COUNT finding(s) as expected"
          fi

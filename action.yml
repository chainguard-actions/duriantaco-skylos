name: "Skylos - Python SAST, Dead Code Detection & PR Gate"
description: "SAST, dead code detection, secrets scanning, and PR gating for Python, TypeScript, Java, and Go."
author: "Skylos (founder@skylos.dev)"
branding:
  icon: "shield"
  color: "blue"
inputs:
  path:
    description: "Path to scan (default: current directory)"
    required: false
    default: "."
  mode:
    description: "Scan mode: 'scan' (report only), 'gate' (fail on issues), 'review' (PR comments + gate)"
    required: false
    default: "gate"
  analysis:
    description: "Analysis types to run (space-separated): dead-code security quality ai-defects secrets"
    required: false
    default: "dead-code security"
  confidence:
    description: "Minimum confidence threshold (0-100)"
    required: false
    default: "60"
  token:
    description: "Optional legacy Skylos API token for uploads. Prefer GitHub OIDC with id-token: write when running in GitHub Actions."
    required: false
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  max-comments:
    description: "Maximum inline PR review comments (default: 15)"
    required: false
    default: "15"
outputs:
  findings-count:
    description: "Total number of findings"
    value: ${{ steps.scan.outputs.findings_count }}
  gate-passed:
    description: "Whether the quality gate passed (true/false)"
    value: ${{ steps.gate.outputs.passed }}
  report-path:
    description: "Path to the JSON report file"
    value: ${{ steps.scan.outputs.report }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Skylos
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"
    - name: Run Skylos Scan
      id: scan
      shell: bash
      env:
        SKYLOS_PATH: ${{ inputs.path }}
        SKYLOS_ANALYSIS: ${{ inputs.analysis }}
        SKYLOS_CONFIDENCE: ${{ inputs.confidence }}
        SKYLOS_TOKEN: ${{ inputs.token }}
      run: |
        REPORT="skylos-report.json"
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"

        # Build flags from analysis types
        FLAGS=()
        if echo "$SKYLOS_ANALYSIS" | grep -q "security"; then
          FLAGS+=(--danger)
        fi
        if echo "$SKYLOS_ANALYSIS" | grep -q "quality"; then
          FLAGS+=(--quality)
        fi
        if echo "$SKYLOS_ANALYSIS" | grep -q "ai-defects"; then
          FLAGS+=(--ai-defects)
        fi
        if echo "$SKYLOS_ANALYSIS" | grep -q "secrets"; then
          FLAGS+=(--secrets)
        fi

        # Run scan
        python -m skylos.cli "$SKYLOS_PATH" \
          --confidence "$SKYLOS_CONFIDENCE" \
          "${FLAGS[@]}" \
          --json > "$REPORT" || true

        # Count findings
        COUNT=$(python -c "
        import json, sys
        data = json.load(open('$REPORT'))
        count = sum(len(v) for v in data.values() if isinstance(v, list))
        print(count)
        ")
        echo "findings_count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "### Skylos Scan Results" >> "$GITHUB_STEP_SUMMARY"
        echo "Found **$COUNT** issue(s) in \`$SKYLOS_PATH\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload to Skylos Dashboard
      shell: bash
      env:
        SKYLOS_TOKEN: ${{ inputs.token }}
        SKYLOS_PATH: ${{ inputs.path }}
        SKYLOS_ANALYSIS: ${{ inputs.analysis }}
        SKYLOS_CONFIDENCE: ${{ inputs.confidence }}
      run: |
        # Upload works with SKYLOS_TOKEN or tokenless via GitHub OIDC
        FLAGS=()
        if echo "$SKYLOS_ANALYSIS" | grep -q "security"; then
          FLAGS+=(--danger)
        fi
        if echo "$SKYLOS_ANALYSIS" | grep -q "quality"; then
          FLAGS+=(--quality)
        fi
        if echo "$SKYLOS_ANALYSIS" | grep -q "ai-defects"; then
          FLAGS+=(--ai-defects)
        fi
        if echo "$SKYLOS_ANALYSIS" | grep -q "secrets"; then
          FLAGS+=(--secrets)
        fi

        python -m skylos.cli "$SKYLOS_PATH" \
          --confidence "$SKYLOS_CONFIDENCE" \
          "${FLAGS[@]}" \
          --upload || echo "Upload failed (non-fatal)"
    - name: Post GitHub Annotations
      if: always()
      shell: bash
      run: |
        python -m skylos.cli cicd annotate \
          --input skylos-report.json \
          --max 50 || true
    - name: Post PR Review Comments
      if: github.event_name == 'pull_request' && (inputs.mode == 'review')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SKYLOS_MAX_COMMENTS: ${{ inputs.max-comments }}
      run: |
        if ! [[ "$SKYLOS_MAX_COMMENTS" =~ ^[0-9]+$ ]]; then
          echo "::error::max-comments must be a non-negative integer"
          exit 1
        fi

        python -m skylos.cli cicd review \
          --input skylos-report.json \
          --max-comments "$SKYLOS_MAX_COMMENTS" || true
    - name: Quality Gate
      id: gate
      if: inputs.mode == 'gate' || inputs.mode == 'review'
      shell: bash
      run: |
        python -m skylos.cli cicd gate \
          --input skylos-report.json \
          --summary
        RESULT=$?
        if [ $RESULT -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
    - name: Upload Report Artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: skylos-report
        path: skylos-report.json
        if-no-files-found: error
        retention-days: 30
